<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SAIF OSINT · HACK TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0a;
            min-height: 100vh;
            font-family: 'Share Tech Mono', monospace;
            color: #00ff00;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            position: relative;
            overflow: hidden;
        }
        /* ===== MATRIX ===== */
        #matrix-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.12;
        }
        .scanline {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, transparent 0px, transparent 2px, rgba(0,255,0,0.015) 2px, rgba(0,255,0,0.015) 4px);
            opacity: 0.5;
        }
        .glitch-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            background: repeating-linear-gradient(0deg, rgba(0,255,0,0.006) 0px, rgba(0,255,0,0.006) 1px, transparent 1px, transparent 3px);
            opacity: 0.3;
            animation: glitch-flicker 0.15s infinite alternate;
        }
        @keyframes glitch-flicker { 0% { opacity: 0.2; } 100% { opacity: 0.5; } }
        .crt-flicker {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            background: rgba(0,255,0,0.02);
            animation: flicker 4s infinite;
        }
        @keyframes flicker {
            0% { opacity: 0; }
            10% { opacity: 0.04; }
            20% { opacity: 0; }
            80% { opacity: 0; }
            90% { opacity: 0.02; }
            100% { opacity: 0; }
        }
        /* ===== TERMINAL ===== */
        .terminal {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 960px;
            max-height: 96vh;
            overflow-y: auto;
            background: rgba(6,12,6,0.94);
            backdrop-filter: blur(14px);
            border: 2px solid rgba(0,255,0,0.06);
            border-radius: 18px;
            padding: 24px 26px 30px;
            box-shadow: 0 0 120px rgba(0,255,0,0.02), inset 0 0 150px rgba(0,255,0,0.01);
            scroll-behavior: smooth;
        }
        .terminal::-webkit-scrollbar { width: 4px; }
        .terminal::-webkit-scrollbar-track { background: rgba(0,255,0,0.01); }
        .terminal::-webkit-scrollbar-thumb { background: rgba(0,255,0,0.06); border-radius: 10px; }
        /* ===== HEADER ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid rgba(0,255,0,0.03);
            padding-bottom: 12px;
            margin-bottom: 14px;
        }
        .header .brand {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 22px;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #00ff00, #00cc44, #00ff00);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: brand-glow 2s infinite;
        }
        @keyframes brand-glow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .header .status {
            font-size: 10px;
            letter-spacing: 2px;
            color: rgba(0,255,0,0.12);
            padding: 4px 14px;
            border: 1px solid rgba(0,255,0,0.03);
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .header .status .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: #00ff00;
            border-radius: 50%;
            animation: dot-pulse 1.2s infinite;
            box-shadow: 0 0 20px #00ff00;
        }
        @keyframes dot-pulse { 0%,100% { opacity:1; } 50% { opacity:0.08; } }
        /* ===== SUBHEADER ===== */
        .subheader {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 11px;
            color: rgba(0,255,0,0.06);
            letter-spacing: 2px;
            padding: 4px 0 10px 0;
            border-bottom: 1px solid rgba(0,255,0,0.015);
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .subheader .prompt { color: rgba(0,255,0,0.12); }
        .subheader .cursor-blink { animation: blink-cursor 1s step-end infinite; }
        @keyframes blink-cursor { 0%,100% { opacity:1; } 50% { opacity:0; } }
        /* ===== INPUT ===== */
        .input-line {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,255,0,0.01);
            border: 1px solid rgba(0,255,0,0.025);
            border-radius: 10px;
            padding: 4px 6px 4px 16px;
            margin-bottom: 12px;
            transition: border-color 0.4s;
        }
        .input-line:focus-within { border-color: rgba(0,255,0,0.05); }
        .input-line .prompt-symbol {
            color: rgba(0,255,0,0.06);
            font-size: 16px;
            user-select: none;
        }
        .input-line input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'Share Tech Mono', monospace;
            font-size: 19px;
            color: #00ff00;
            padding: 14px 6px;
            letter-spacing: 3px;
            min-width: 60px;
        }
        .input-line input::placeholder { color: rgba(0,255,0,0.03); font-size: 14px; }
        .input-line .btn-execute {
            background: linear-gradient(135deg, #00cc44, #00aa33);
            border: none;
            border-radius: 8px;
            padding: 14px 32px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #0a0a0a;
            cursor: pointer;
            transition: all 0.3s;
            white-space: nowrap;
            box-shadow: 0 0 40px rgba(0,255,0,0.02);
        }
        .input-line .btn-execute:hover { transform: scale(1.02); box-shadow: 0 0 80px rgba(0,255,0,0.04); background: linear-gradient(135deg, #00dd55, #00bb44); }
        .input-line .btn-execute:active { transform: scale(0.94); }
        .input-line .btn-execute:disabled { opacity: 0.15; cursor: not-allowed; transform: none !important; }
        /* ===== LOADER ===== */
        .loader {
            display: none;
            align-items: center;
            gap: 14px;
            padding: 6px 0 4px 16px;
            color: rgba(0,255,0,0.08);
            font-size: 12px;
            letter-spacing: 2px;
        }
        .loader.active { display: flex; }
        .loader .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0,255,0,0.02);
            border-top: 2px solid #00ff00;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* ===== ERROR ===== */
        .error-box {
            background: rgba(255,68,102,0.015);
            border: 1px solid rgba(255,68,102,0.03);
            border-radius: 8px;
            padding: 10px 16px;
            color: #ff6688;
            font-size: 13px;
            display: none;
            margin-top: 2px;
            margin-left: 4px;
        }
        .error-box.active {
            display: block;
            animation: fadeSlide 0.3s ease;
        }
        @keyframes fadeSlide { 0% { opacity:0; transform:translateY(6px); } 100% { opacity:1; transform:translateY(0); } }
        .error-box .retry-btn {
            background: rgba(255,68,102,0.04);
            border: 1px solid rgba(255,68,102,0.04);
            border-radius: 4px;
            padding: 2px 12px;
            color: #ff6688;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            margin-left: 10px;
            transition: all 0.2s;
        }
        .error-box .retry-btn:hover { background: rgba(255,68,102,0.08); border-color: rgba(255,68,102,0.08); }
        /* ===== OUTPUT ===== */
        .output-area {
            margin-top: 14px;
            border-top: 1px solid rgba(0,255,0,0.015);
            padding-top: 14px;
            min-height: 80px;
        }
        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid rgba(0,255,0,0.01);
        }
        .output-header .label {
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(0,255,0,0.03);
        }
        .output-header .label .blink-arrow { animation: blink-arrow 1s infinite; }
        @keyframes blink-arrow { 0%,100% { opacity:1; } 50% { opacity:0.02; } }
        .output-header .copy-btn {
            background: rgba(0,255,0,0.01);
            border: 1px solid rgba(0,255,0,0.015);
            border-radius: 6px;
            padding: 4px 14px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 10px;
            color: rgba(0,255,0,0.06);
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
        }
        .output-header .copy-btn:hover { background: rgba(0,255,0,0.015); border-color: rgba(0,255,0,0.03); color: #00ff00; }
        .output-header .copy-btn.copied { border-color: #00ff00; color: #00ff00; background: rgba(0,255,0,0.015); }
        /* ===== TYPING ===== */
        .typing-container {
            font-family: 'Share Tech Mono', monospace;
            font-size: 15px;
            line-height: 2.0;
            color: #70ff70;
            white-space: pre-wrap;
            word-break: break-word;
            min-height: 60px;
            padding: 8px 4px;
            max-height: 420px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }
        .typing-container::-webkit-scrollbar { width: 3px; }
        .typing-container::-webkit-scrollbar-thumb { background: rgba(0,255,0,0.02); border-radius: 10px; }
        .typing-container .cursor {
            display: inline-block;
            width: 10px;
            height: 20px;
            background: #00ff00;
            animation: blink-cursor 0.8s step-end infinite;
            vertical-align: text-bottom;
            margin-left: 2px;
            box-shadow: 0 0 30px #00ff00;
        }
        .typing-container .line { display: block; }
        .typing-container .highlight { color: #00ff00; font-weight: bold; text-shadow: 0 0 40px rgba(0,255,0,0.03); }
        .typing-container .label-key {
            color: rgba(0,255,0,0.06);
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: inline-block;
            min-width: 80px;
        }
        .typing-container .separator { color: rgba(0,255,0,0.015); }
        .typing-container .welcome-text {
            font-size: 30px;
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            padding: 30px 0;
            background: linear-gradient(135deg, #00ff00, #00cc44, #00ff00);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: welcome-glow 3s infinite;
            letter-spacing: 6px;
        }
        @keyframes welcome-glow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .typing-container .hacking-text {
            color: #00ff00;
            font-weight: bold;
            text-align: center;
            font-size: 24px;
            padding: 20px 0;
            animation: hack-pulse 1s infinite;
            letter-spacing: 6px;
        }
        @keyframes hack-pulse { 0% { opacity:0.2; } 50% { opacity:1; } 100% { opacity:0.2; } }
        .typing-container .hacked-text {
            color: #00ff00;
            font-weight: bold;
            text-align: center;
            font-size: 28px;
            padding: 10px 0 20px 0;
            text-shadow: 0 0 80px rgba(0,255,0,0.03);
            animation: glitch-hack 0.2s infinite alternate;
            letter-spacing: 8px;
        }
        @keyframes glitch-hack { 0% { transform: translateX(-3px); opacity:0.9; } 100% { transform: translateX(3px); opacity:1; } }
        /* ===== HACKER KEYBOARD ===== */
        .hacker-keyboard {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px solid rgba(0,255,0,0.01);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }
        .hacker-keyboard .key {
            background: rgba(0,255,0,0.015);
            border: 1px solid rgba(0,255,0,0.04);
            border-radius: 4px;
            padding: 6px 10px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: rgba(0,255,0,0.15);
            cursor: pointer;
            transition: all 0.15s;
            min-width: 32px;
            text-align: center;
            user-select: none;
            letter-spacing: 1px;
        }
        .hacker-keyboard .key:hover {
            background: rgba(0,255,0,0.04);
            border-color: rgba(0,255,0,0.08);
            color: #00ff00;
            box-shadow: 0 0 20px rgba(0,255,0,0.02);
        }
        .hacker-keyboard .key:active {
            transform: scale(0.92);
            background: rgba(0,255,0,0.06);
            box-shadow: 0 0 30px rgba(0,255,0,0.04);
        }
        .hacker-keyboard .key.space {
            min-width: 120px;
            flex: 1;
        }
        .hacker-keyboard .key.special {
            color: rgba(0,255,0,0.04);
            border-color: rgba(0,255,0,0.01);
        }
        .hacker-keyboard .key.special:hover {
            color: rgba(0,255,0,0.1);
            border-color: rgba(0,255,0,0.02);
        }
        .hacker-keyboard .key .key-glow {
            display: none;
        }
        .hacker-keyboard .key.active-key {
            background: rgba(0,255,0,0.06);
            border-color: rgba(0,255,0,0.08);
            color: #00ff00;
            box-shadow: 0 0 30px rgba(0,255,0,0.02);
        }
        /* ===== BOTTOM BAR ===== */
        .bottom-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            padding-top: 14px;
            border-top: 1px solid rgba(0,255,0,0.01);
        }
        .bottom-bar .badge {
            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(0,255,0,0.015);
            padding: 3px 14px;
            border: 1px solid rgba(0,255,0,0.008);
            border-radius: 30px;
            background: rgba(0,255,0,0.002);
        }
        .bottom-bar .badge strong { color: rgba(0,255,0,0.025); font-weight: normal; }
        /* ===== RESPONSIVE ===== */
        @media (max-width: 750px) {
            .terminal { padding: 16px 14px 20px; border-radius: 12px; max-height: 98vh; }
            .header .brand { font-size: 17px; letter-spacing: 2px; }
            .input-line { flex-wrap: wrap; padding: 6px 8px; background: transparent; border: none; }
            .input-line input { font-size: 16px; padding: 12px 4px; width:100%; border:1px solid rgba(0,255,0,0.015); border-radius:8px; padding:12px 14px; background:rgba(0,255,0,0.005); }
            .input-line .prompt-symbol { display: none; }
            .input-line .btn-execute { width:100%; padding:12px; font-size:12px; margin-top:4px; }
            .typing-container { font-size:13px; line-height:1.9; max-height:300px; }
            .typing-container .label-key { min-width:60px; font-size:10px; }
            .typing-container .welcome-text { font-size:20px; }
            .subheader { font-size:10px; }
            .header .status { font-size:9px; padding:2px 10px; }
            .hacker-keyboard .key { padding:4px 6px; font-size:9px; min-width:24px; }
            .hacker-keyboard .key.space { min-width:60px; }
        }
        @media (max-width: 400px) {
            .terminal { padding: 10px 8px 14px; border-radius: 8px; }
            .header .brand { font-size: 14px; }
            .input-line input { font-size: 14px; padding: 10px 10px; }
            .typing-container { font-size: 12px; line-height: 1.8; }
            .typing-container .welcome-text { font-size: 16px; }
            .bottom-bar .badge { font-size: 7px; padding: 1px 8px; }
            .hacker-keyboard .key { padding: 3px 5px; font-size: 8px; min-width: 18px; }
            .hacker-keyboard .key.space { min-width: 40px; }
        }
        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: rgba(0,255,0,0.002); }
        ::-webkit-scrollbar-thumb { background: rgba(0,255,0,0.02); border-radius: 10px; }
    </style>
</head>
<body>

    <!-- ===== BACKGROUND ===== -->
    <canvas id="matrix-canvas"></canvas>
    <div class="scanline"></div>
    <div class="glitch-overlay"></div>
    <div class="crt-flicker"></div>

    <!-- ===== TERMINAL ===== -->
    <div class="terminal" id="terminal">

        <!-- HEADER -->
        <div class="header">
            <span class="brand">⏣ SAIF·OSINT</span>
            <span class="status"><span class="dot"></span> ROOT · v3.0</span>
        </div>

        <!-- SUBHEADER -->
        <div class="subheader">
            <span class="prompt">$</span>
            <span style="color:rgba(0,255,0,0.02);">[</span>
            <span style="color:rgba(0,255,0,0.03);">NUMBER·INTELLIGENCE</span>
            <span style="color:rgba(0,255,0,0.02);">]</span>
            <span style="color:rgba(0,255,0,0.005);">──</span>
            <span style="color:rgba(0,255,0,0.005);">#root</span>
            <span class="cursor-blink">█</span>
        </div>

        <!-- INPUT -->
        <div class="input-line">
            <span class="prompt-symbol">▸</span>
            <input type="text" id="numberInput" placeholder="9661756498" value="9661756498" autofocus spellcheck="false" autocomplete="off" />
            <button class="btn-execute" id="searchBtn">⟳ EXEC</button>
        </div>

        <!-- LOADER -->
        <div class="loader" id="loader">
            <div class="spinner"></div>
            <span>decrypting payload</span>
        </div>

        <!-- ERROR -->
        <div class="error-box" id="errorMsg">
            ⚠️ <span id="errorText">Invalid number.</span>
            <button class="retry-btn" id="retryBtn">↻ RETRY</button>
        </div>

        <!-- OUTPUT -->
        <div class="output-area">
            <div class="output-header">
                <span class="label"><span class="blink-arrow">▸</span> RESPONSE</span>
                <button class="copy-btn" id="copyBtn">⎘ COPY</button>
            </div>

            <div class="typing-container" id="typingContainer">
                <div class="welcome-text" id="welcomeMsg">
                    ═══ WELCOME TO SAIF OSINT ═══
                </div>
            </div>
        </div>

        <!-- ===== HACKER KEYBOARD ===== -->
        <div class="hacker-keyboard" id="hackerKeyboard">
            <!-- Row 1 -->
            <div class="key" data-value="1">1</div>
            <div class="key" data-value="2">2</div>
            <div class="key" data-value="3">3</div>
            <div class="key" data-value="4">4</div>
            <div class="key" data-value="5">5</div>
            <div class="key" data-value="6">6</div>
            <div class="key" data-value="7">7</div>
            <div class="key" data-value="8">8</div>
            <div class="key" data-value="9">9</div>
            <div class="key" data-value="0">0</div>
            <!-- Row 2 -->
            <div class="key" data-value="q">q</div>
            <div class="key" data-value="w">w</div>
            <div class="key" data-value="e">e</div>
            <div class="key" data-value="r">r</div>
            <div class="key" data-value="t">t</div>
            <div class="key" data-value="y">y</div>
            <div class="key" data-value="u">u</div>
            <div class="key" data-value="i">i</div>
            <div class="key" data-value="o">o</div>
            <div class="key" data-value="p">p</div>
            <!-- Row 3 -->
            <div class="key" data-value="a">a</div>
            <div class="key" data-value="s">s</div>
            <div class="key" data-value="d">d</div>
            <div class="key" data-value="f">f</div>
            <div class="key" data-value="g">g</div>
            <div class="key" data-value="h">h</div>
            <div class="key" data-value="j">j</div>
            <div class="key" data-value="k">k</div>
            <div class="key" data-value="l">l</div>
            <!-- Row 4 -->
            <div class="key" data-value="z">z</div>
            <div class="key" data-value="x">x</div>
            <div class="key" data-value="c">c</div>
            <div class="key" data-value="v">v</div>
            <div class="key" data-value="b">b</div>
            <div class="key" data-value="n">n</div>
            <div class="key" data-value="m">m</div>
            <!-- Special keys -->
            <div class="key special" data-value="backspace">⌫</div>
            <div class="key space" data-value=" ">␣</div>
            <div class="key special" data-value="clear">✕</div>
        </div>

        <!-- BOTTOM BAR -->
        <div class="bottom-bar">
            <span class="badge">⚡ <strong>@saifali883883</strong></span>
            <span class="badge">🔒 <strong>SAIF OSINT</strong></span>
            <span class="badge">📡 <strong>ROOT</strong></span>
        </div>

    </div>

    <script>
        (function() {
            'use strict';

            // ---- DOM ----
            const input = document.getElementById('numberInput');
            const searchBtn = document.getElementById('searchBtn');
            const loader = document.getElementById('loader');
            const errorMsg = document.getElementById('errorMsg');
            const errorText = document.getElementById('errorText');
            const retryBtn = document.getElementById('retryBtn');
            const typingContainer = document.getElementById('typingContainer');
            const copyBtn = document.getElementById('copyBtn');
            const terminal = document.getElementById('terminal');
            const keyboard = document.getElementById('hackerKeyboard');

            // ---- state ----
            let lastData = null;
            let isTyping = false;
            let typingAbort = false;
            let keyPressTimeout = null;

            // ---- REAL API ----
            const API_BASE = 'https://movements-invoice-amanda-victoria.trycloudflare.com/search/number';
            const API_KEY = 'mysecretkey123';
            const CORS_PROXY = 'https://api.allorigins.win/raw?url=';

            // ---- BACKUP DEMO ----
            function getBackupData(number) {
                const demos = {
                    "9661756498": { status:"success", result: { num:"9661756498", name:"Saroj Devi", fname:"Dharmendra Yadav", aadhar:"374785977880", circle:"AIRTEL BHR&JHR", address:"Vill Mahuajhor, Kastha, Gaya, Bihar 824209", email:null, alt:null } },
                    "8294938603": { status:"success", result: { num:"8294938603", name:"Rahul Kumar", fname:"Suresh Singh", aadhar:"456789123456", circle:"JIO BHR", address:"Patna, Bihar 800001", email:"rahul@email.com", alt:"9876543210" } },
                    "7858894812": { status:"success", result: { num:"7858894812", name:"Priya Sharma", fname:"Rajesh Sharma", aadhar:"987654321098", circle:"VODAFONE", address:"Delhi, India 110001", email:"priya@email.com", alt:"8765432109" } }
                };
                if (demos[number]) return demos[number];
                return { status:"success", result: { num:number, name:"User Not Found", fname:"—", aadhar:"—", circle:"—", address:"No records found for this number", email:"—", alt:"—" } };
            }

            // ---- helpers ----
            function formatNumber(raw) {
                let d = raw.replace(/\D/g,'');
                if (d.startsWith('91') && d.length>10) d = d.slice(2);
                if (d.length>10) d = d.slice(-10);
                return d;
            }
            function isValidNumber(n) { return /^[0-9]{10}$/.test(n); }
            function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

            // ---- fetch ----
            async function fetchWithCorsFallback(url) {
                try {
                    const r = await fetch(url, { method:'GET', headers:{'Accept':'application/json'} });
                    if (r.ok) return r;
                } catch(e) { console.log('Direct fetch failed, trying CORS proxy...'); }
                const proxyUrl = CORS_PROXY + encodeURIComponent(url);
                return await fetch(proxyUrl);
            }

            // ---- typewriter ----
            async function typeText(lines, container, totalDuration = 15000) {
                if (isTyping) return;
                isTyping = true;
                typingAbort = false;
                container.innerHTML = '';
                const full = lines.join('\n');
                const chars = full.split('');
                const total = chars.length;
                const delay = Math.max(6, totalDuration / total);
                let current = '';
                let idx = 0;
                const cursor = document.createElement('span');
                cursor.className = 'cursor';
                container.appendChild(cursor);
                while (idx < chars.length) {
                    if (typingAbort) break;
                    current += chars[idx];
                    idx++;
                    const node = document.createTextNode(current);
                    container.innerHTML = '';
                    container.appendChild(node);
                    container.appendChild(cursor);
                    container.scrollTop = container.scrollHeight;
                    terminal.scrollTop = terminal.scrollHeight;
                    let d = delay;
                    if (chars[idx-1] === '\n') d = delay * 1.6;
                    else if (chars[idx-1] === ' ' || chars[idx-1] === '\t') d = delay * 0.4;
                    else if (chars[idx-1] === ',' || chars[idx-1] === '.' || chars[idx-1] === ':' || chars[idx-1] === ';') d = delay * 1.3;
                    else if (chars[idx-1] === '─') d = delay * 0.3;
                    await sleep(Math.min(d, 100));
                }
                container.innerHTML = renderStyled(lines);
                isTyping = false;
            }

            function renderStyled(lines) {
                let html = '';
                for (let line of lines) {
                    const match = line.match(/^(.+?)\s*:\s*(.+)$/);
                    if (match) {
                        const label = match[1].trim();
                        const value = match[2].trim();
                        const isHighlight = label.toLowerCase() === 'number';
                        const cls = isHighlight ? 'highlight' : '';
                        html += `<span class="line"><span class="label-key">${label}</span><span class="separator"> : </span><span class="${cls}">${value}</span></span>`;
                    } else {
                        html += `<span class="line">${line}</span>`;
                    }
                }
                return html;
            }

            function formatDataForDisplay(data) {
                const lines = [];
                let items = [];
                if (Array.isArray(data.result)) items = data.result;
                else if (data.result && typeof data.result === 'object') items = [data.result];
                else items = [];
                if (items.length === 0) {
                    lines.push('⚠️  NO RECORDS FOUND');
                    lines.push('└── target number not in database');
                    return lines;
                }
                const total = items.length;
                lines.push(`📡  INTELLIGENCE REPORT  —  ${total} record(s) found`);
                lines.push('');
                items.forEach((item, idx) => {
                    if (idx > 0) lines.push('───');
                    lines.push(`  [${idx + 1}/${total}]`);
                    lines.push(`  Number      : ${item.num || '—'}`);
                    lines.push(`  Name        : ${item.name || '—'}`);
                    lines.push(`  Father      : ${item.fname || '—'}`);
                    lines.push(`  Aadhar      : ${item.aadhar || '—'}`);
                    lines.push(`  Circle      : ${item.circle || '—'}`);
                    lines.push(`  Address     : ${item.address || '—'}`);
                    lines.push(`  Email       : ${item.email || '—'}`);
                    lines.push(`  Alternate   : ${item.alt || '—'}`);
                });
                lines.push('');
                lines.push('✔  EXTRACTION COMPLETE  ·  SIGNAL TERMINATED');
                return lines;
            }

            async function showHackingProcess(container) {
                container.innerHTML = `<div class="hacking-text">▸ HACKING IN PROCESS... ▸</div>`;
                await sleep(2000);
            }

            async function showSystemHacked(container) {
                container.innerHTML = `<div class="hacked-text">⚠ SYSTEM HACKED ⚠</div>`;
                await sleep(1200);
            }

            // ---- main ----
            async function performLookup() {
                const raw = input.value.trim();
                const clean = formatNumber(raw);
                if (!isValidNumber(clean)) {
                    input.style.borderColor = 'rgba(255,68,102,0.08)';
                    errorText.textContent = '❌ Invalid · must be 10 digits (e.g. 9661756498)';
                    errorMsg.classList.add('active');
                    typingContainer.innerHTML = `<div class="welcome-text">═══ WELCOME TO SAIF OSINT ═══</div>`;
                    return;
                }
                input.style.borderColor = '';
                errorMsg.classList.remove('active');

                const url = `${API_BASE}?number=${clean}&key=${API_KEY}`;
                loader.classList.add('active');
                searchBtn.disabled = true;
                typingAbort = true;
                await sleep(50);
                typingAbort = false;

                try {
                    await showHackingProcess(typingContainer);

                    let data = null;
                    let apiSuccess = false;

                    // ---- Try REAL API ----
                    try {
                        const response = await fetchWithCorsFallback(url);
                        if (response.ok) {
                            const json = await response.json();
                            if (json.status === 'success') {
                                data = json;
                                apiSuccess = true;
                            }
                        }
                    } catch (e) { console.log('API failed:', e); }

                    // ---- FALLBACK to demo ----
                    if (!apiSuccess) {
                        data = getBackupData(clean);
                        errorText.textContent = '⚠️ API unreachable · showing cached data';
                        errorMsg.classList.add('active');
                        setTimeout(() => errorMsg.classList.remove('active'), 3000);
                    } else {
                        // success - clear any old error
                        errorMsg.classList.remove('active');
                    }

                    lastData = data;
                    await showSystemHacked(typingContainer);
                    const lines = formatDataForDisplay(data);
                    await typeText(lines, typingContainer, 15000);

                } catch (err) {
                    errorText.textContent = err.message || 'Network error';
                    errorMsg.classList.add('active');
                    typingContainer.innerHTML = `<div class="welcome-text">═══ WELCOME TO SAIF OSINT ═══</div>`;
                } finally {
                    loader.classList.remove('active');
                    searchBtn.disabled = false;
                }
            }

            // ---- copy ----
            function copyData() {
                if (!lastData) {
                    copyBtn.textContent = '⛔ NO DATA';
                    setTimeout(() => copyBtn.textContent = '⎘ COPY', 1400);
                    return;
                }
                const json = JSON.stringify(lastData, null, 2);
                navigator.clipboard.writeText(json).then(() => {
                    copyBtn.textContent = '✓ COPIED!';
                    copyBtn.classList.add('copied');
                    setTimeout(() => {
                        copyBtn.textContent = '⎘ COPY';
                        copyBtn.classList.remove('copied');
                    }, 2400);
                }).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = json;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    copyBtn.textContent = '✓ COPIED!';
                    setTimeout(() => copyBtn.textContent = '⎘ COPY', 2000);
                });
            }

            // ---- matrix rain ----
            function initMatrix() {
                const canvas = document.getElementById('matrix-canvas');
                const ctx = canvas.getContext('2d');
                let w, h;
                const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*()';
                let columns, drops;
                let fontSize = 14;
                function resize() {
                    w = canvas.width = window.innerWidth;
                    h = canvas.height = window.innerHeight;
                    fontSize = Math.max(10, Math.min(16, w / 88));
                    columns = Math.floor(w / fontSize);
                    drops = [];
                    for (let i = 0; i < columns; i++) drops.push(Math.floor(Math.random() * -120));
                }
                function draw() {
                    ctx.fillStyle = 'rgba(10,10,10,0.04)';
                    ctx.fillRect(0, 0, w, h);
                    ctx.font = `${fontSize}px 'Share Tech Mono', monospace`;
                    ctx.textAlign = 'center';
                    for (let i = 0; i < drops.length; i++) {
                        const ch = chars[Math.floor(Math.random() * chars.length)];
                        const x = i * fontSize + fontSize / 2;
                        const y = drops[i] * fontSize;
                        const brightness = 0.10 + 0.90 * (1 - Math.abs(y / h));
                        ctx.fillStyle = `rgba(0, 255, 0, ${brightness * 0.12})`;
                        ctx.fillText(ch, x, y);
                        drops[i] += 0.3 + Math.random() * 0.5;
                        if (drops[i] * fontSize > h + 50) drops[i] = Math.floor(Math.random() * -40);
                    }
                    requestAnimationFrame(draw);
                }
                window.addEventListener('resize', resize);
                resize();
                draw();
            }

            // ---- HACKER KEYBOARD ----
            function setupKeyboard() {
                const keys = keyboard.querySelectorAll('.key');
                keys.forEach(key => {
                    key.addEventListener('click', function(e) {
                        const value = this.dataset.value;
                        const inputField = input;
                        const start = inputField.selectionStart;
                        const end = inputField.selectionEnd;

                        // Visual feedback
                        this.classList.add('active-key');
                        clearTimeout(keyPressTimeout);
                        keyPressTimeout = setTimeout(() => {
                            this.classList.remove('active-key');
                        }, 150);

                        if (value === 'backspace') {
                            // delete character before cursor
                            if (start > 0) {
                                const newVal = inputField.value.slice(0, start - 1) + inputField.value.slice(end);
                                inputField.value = newVal;
                                inputField.selectionStart = inputField.selectionEnd = start - 1;
                            }
                        } else if (value === 'clear') {
                            inputField.value = '';
                            inputField.focus();
                        } else if (value === ' ') {
                            // insert space
                            const newVal = inputField.value.slice(0, start) + ' ' + inputField.value.slice(end);
                            inputField.value = newVal;
                            inputField.selectionStart = inputField.selectionEnd = start + 1;
                        } else {
                            // insert character
                            const newVal = inputField.value.slice(0, start) + value + inputField.value.slice(end);
                            inputField.value = newVal;
                            inputField.selectionStart = inputField.selectionEnd = start + value.length;
                        }
                        inputField.focus();
                        inputField.dispatchEvent(new Event('input', { bubbles: true }));
                    });
                });

                // Physical keyboard shortcuts
                document.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        performLookup();
                    }
                });
            }

            // ---- events ----
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); performLookup(); }
                if (e.key === 'Escape') {
                    input.blur();
                    input.style.borderColor = '';
                    errorMsg.classList.remove('active');
                    typingContainer.innerHTML = `<div class="welcome-text">═══ WELCOME TO SAIF OSINT ═══</div>`;
                }
            });
            input.addEventListener('focus', () => {
                input.style.borderColor = '';
                errorMsg.classList.remove('active');
            });
            searchBtn.addEventListener('click', performLookup);
            retryBtn.addEventListener('click', performLookup);
            copyBtn.addEventListener('click', copyData);

            // ---- init ----
            window.addEventListener('DOMContentLoaded', () => {
                initMatrix();
                setupKeyboard();
                typingContainer.innerHTML = `<div class="welcome-text">═══ WELCOME TO SAIF OSINT ═══</div>`;
            });

        })();
    </script>
